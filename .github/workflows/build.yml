name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.2
  PROJECT_NAME: KnotEngine
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  HXCPP_DEBUG: 0

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        if: startsWith(inputs.name, 'Android')
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        if: startsWith(inputs.name, 'Android')
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Android NDK
        if: startsWith(inputs.name, 'Android')
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Linux dependencies
        if: startsWith(inputs.name, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev
          if [[ "${{ inputs.name }}" == "Linux x32" ]]; then
            sudo apt-get install -y g++-multilib libc6-dev-i386
          fi

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.4'

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: startsWith(inputs.name, 'Android')
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile Release
        shell: bash
        run: haxelib run lime build ${{ inputs.buildArgs }}

      # Strip native binaries and remove symbol files. APKs are intentionally
      # excluded because changing an APK after signing invalidates its signature.
      - name: Strip Linux and remove symbols
        if: startsWith(inputs.name, 'Linux')
        shell: bash
        run: |
          OUT="export/${{ startsWith(inputs.name, 'Linux x32') && '32bit' || 'release' }}/linux/bin"
          find "$OUT" -type f \( -name '*.pdb' -o -name '*.ilk' -o -name '*.debug' \) -delete || true
          find "$OUT" -type f -perm -0100 -exec strip --strip-unneeded {} + || true
          find "$OUT" -type f -name '*.so' -exec strip --strip-unneeded {} + || true

      - name: Strip Windows and remove symbols
        if: startsWith(inputs.name, 'Windows')
        shell: pwsh
        run: |
          $out = if ('${{ inputs.name }}' -eq 'Windows x32') { 'export\32bit\windows\bin' } else { 'export\release\windows\bin' }
          Get-ChildItem -Path $out -Recurse -Include *.pdb,*.ilk,*.debug -File -ErrorAction SilentlyContinue | Remove-Item -Force
          $strip = (Get-Command llvm-strip.exe -ErrorAction SilentlyContinue).Source
          if (-not $strip) { $strip = (Get-Command strip.exe -ErrorAction SilentlyContinue).Source }
          if ($strip) {
            Get-ChildItem -Path $out -Recurse -Include *.exe,*.dll -File | ForEach-Object {
              & $strip --strip-debug $_.FullName
            }
          }

      - name: Strip macOS and remove symbols
        if: inputs.name == 'MacOS'
        shell: bash
        run: |
          OUT="export/release/macos/bin"
          find "$OUT" -type f \( -name '*.dSYM' -o -name '*.pdb' \) -prune -exec rm -rf {} + || true
          find "$OUT" -type f -perm -0100 -exec xcrun strip -x {} + || true

      - name: Make IPA
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload
          zip -r "${{ env.PROJECT_NAME }}.ipa" Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
