name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: KnotEngine

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            buildArgs: "windows -final -X64 -D HXCPP_X64 -D 64bits"
            artifactName: Windows x64
            artifactPath: export\release\windows\bin
          - name: Windows x32
            os: windows-2022
            buildArgs: "windows -final -X32 -D HXCPP_X32 -D 32bits"
            artifactName: Windows x32
            artifactPath: export\32bit\windows\bin
          - name: Linux x64
            os: ubuntu-22.04
            buildArgs: "linux -final"
            artifactName: Linux x64
            artifactPath: export/release/linux/bin
          - name: Linux x32
            os: ubuntu-22.04
            buildArgs: "linux -final -X32 -D HXCPP_X32 -D 32bits"
            artifactName: Linux x32
            artifactPath: export/32bit/linux/bin
          - name: MacOS
            os: macos-15
            buildArgs: "mac -final"
            artifactName: MacOS
            artifactPath: export/release/macos/bin
          - name: Android x64
            os: ubuntu-22.04
            buildArgs: "android -final -ONLY_ARM64"
            artifactName: Android x64
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: Android x32
            os: ubuntu-22.04
            buildArgs: "android -final -ONLY_ARMV7"
            artifactName: Android x32
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-15
            buildArgs: "ios -final -nosign"
            artifactName: iOS
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}

  releaser:
    needs: [build]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /home/runner/artifacts

      - name: Package desktop artifacts
        shell: bash
        run: |
          cd /home/runner/artifacts
          for dir in "Windows x64" "Windows x32" "Linux x64" "Linux x32" MacOS; do
            [ -d "$dir" ] || continue
            safe=$(echo "$dir" | tr ' ' '-')
            if [[ "$dir" == Linux* || "$dir" == MacOS ]]; then
              tar -czf "/home/runner/${{ env.PROJECT_NAME }}-${safe}.tar.gz" "$dir"
            else
              zip -qr "/home/runner/${{ env.PROJECT_NAME }}-${safe}.zip" "$dir"
            fi
          done

      - name: Package mobile artifacts
        shell: bash
        run: |
          x64=$(find "/home/runner/artifacts/Android x64" -type f -name '*.apk' -print -quit)
          x32=$(find "/home/runner/artifacts/Android x32" -type f -name '*.apk' -print -quit)
          [ -z "$x64" ] || cp "$x64" "/home/runner/${{ env.PROJECT_NAME }}-Android-x64.apk"
          [ -z "$x32" ] || cp "$x32" "/home/runner/${{ env.PROJECT_NAME }}-Android-x32.apk"
          find /home/runner/artifacts -type f -name '*.ipa' -exec cp {} /home/runner/ \;

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "7.0.0"
          tag_name: "7.0.0"
          files: |
            /home/runner/*.apk
            /home/runner/*.ipa
            /home/runner/*.tar.gz
            /home/runner/*.zip
